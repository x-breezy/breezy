services:
  postgres-user-service:
    image: postgres:16
    container_name: breezy-postgres-user-service
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_USER_PASSWORD}
      POSTGRES_DB: user_service
      POSTGRES_HOST_AUTH_METHOD: md5
      POSTGRES_INITDB_ARGS: "--auth-host=md5 --auth-local=md5"
    volumes:
      - postgres-user-service-data:/var/lib/postgresql/data
    networks:
      - db-net
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-profile-service:
    image: postgres:16
    container_name: breezy-postgres-profile-service
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PROFILE_PASSWORD}
      POSTGRES_DB: profile_service
      POSTGRES_HOST_AUTH_METHOD: md5
      POSTGRES_INITDB_ARGS: "--auth-host=md5 --auth-local=md5"
    volumes:
      - postgres-profile-service-data:/var/lib/postgresql/data
    networks:
      - db-net
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongo-post-service:
    image: mongo:8
    container_name: breezy-mongo-post-service
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: post_service
    volumes:
      - mongo-post-service-data:/data/db
    networks:
      - db-net
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongo-media-service:
    image: mongo:8
    container_name: breezy-mongo-media-service
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: media_service
    volumes:
      - mongo-media-service-data:/data/db
    networks:
      - db-net
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongo-notifications-service:
    image: mongo:8
    container_name: breezy-mongo-notifications-service
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: notifications_service
    volumes:
      - mongo-notifications-service-data:/data/db
    networks:
      - db-net
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongo-message-service:
    image: mongo:8
    container_name: breezy-mongo-message-service
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: message_service
    volumes:
      - mongo-message-service-data:/data/db
    networks:
      - db-net
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management
    container_name: breezy-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS}
    networks:
      - services-net
      - gateway-net
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: breezy-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    networks:
      - services-net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    container_name: breezy-elasticsearch
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    networks:
      - services-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9200"]
      interval: 15s
      timeout: 5s
      retries: 10

  kibana:
    image: docker.elastic.co/kibana/kibana:8.15.0
    container_name: breezy-kibana
    restart: unless-stopped
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
      XPACK_SECURITY_ENABLED: "false"
      SERVER_PUBLICBASEURL: https://logs.breezy.clementomnes.dev
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:5601/api/status || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 120s
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - services-net
      - gateway-net

  auth-service:
    build:
      context: .
      dockerfile: apps/auth-service/Dockerfile
    container_name: breezy-auth-service
    restart: unless-stopped
    volumes:
      - shared-logs:/logs
      - /etc/breezy/secrets/private.pem:/secrets/private.pem:ro
      - /etc/breezy/secrets/public.pem:/secrets/public.pem:ro
    environment:
      NODE_ENV: production
      SERVICE_NAME: auth-service
      OTEL_ENABLED: ${OTEL_ENABLED:-false}
      OTEL_SERVICE_NAME: auth-service
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://jaeger:4318/v1/traces
      PORT: 4020
      DATABASE_URL: postgres://postgres:${POSTGRES_USER_PASSWORD}@postgres-user-service:5432/user_service
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASS}@rabbitmq:5672
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      FRONTEND_URL: https://${DOMAIN}
      JWT_PRIVATE_KEY_PATH: /secrets/private.pem
      JWT_PUBLIC_KEY_PATH: /secrets/public.pem
      JWT_KID: ${JWT_KID}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN}
      REFRESH_TOKEN_TTL_MS: ${REFRESH_TOKEN_TTL_MS}
      PROFILE_SERVICE_GRPC_URL: profile-service:50051
      PROFILE_SERVICE_URL: http://profile-service:4010
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_REDIRECT_URI: https://${DOMAIN}/api/auth/google/callback
      LOG_FILE: /logs/auth-service.log
      LOG_LEVEL: info
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:4020/health/ready',res=>process.exit(res.statusCode===200?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      postgres-user-service:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      profile-service:
        condition: service_healthy
    networks:
      - gateway-net
      - services-net
      - db-net

  profile-service:
    build:
      context: .
      dockerfile: apps/profile-service/Dockerfile
    container_name: breezy-profile-service
    restart: unless-stopped
    volumes:
      - shared-logs:/logs
      - /etc/breezy/secrets/public.pem:/secrets/public.pem:ro
    environment:
      NODE_ENV: production
      SERVICE_NAME: profile-service
      OTEL_ENABLED: ${OTEL_ENABLED:-false}
      OTEL_SERVICE_NAME: profile-service
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://jaeger:4318/v1/traces
      PORT: 4010
      GRPC_PORT: 50051
      DATABASE_URL: postgres://postgres:${POSTGRES_PROFILE_PASSWORD}@postgres-profile-service:5432/profile_service
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASS}@rabbitmq:5672
      JWT_PUBLIC_KEY_PATH: /secrets/public.pem
      PROFILE_SERVICE_GRPC_URL: profile-service:50051
      LOG_FILE: /logs/profile-service.log
      LOG_LEVEL: info
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:4010/health/ready',res=>process.exit(res.statusCode===200?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      postgres-profile-service:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - gateway-net
      - services-net
      - db-net

  post-service:
    build:
      context: .
      dockerfile: apps/post-service/Dockerfile
    container_name: breezy-post-service
    restart: unless-stopped
    volumes:
      - shared-logs:/logs
      - /etc/breezy/secrets/public.pem:/secrets/public.pem:ro
    environment:
      NODE_ENV: production
      SERVICE_NAME: post-service
      OTEL_ENABLED: ${OTEL_ENABLED:-false}
      OTEL_SERVICE_NAME: post-service
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://jaeger:4318/v1/traces
      PORT: 4040
      DATABASE_URL: mongodb://mongo-post-service:27017/post_service
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASS}@rabbitmq:5672
      JWT_PUBLIC_KEY_PATH: /secrets/public.pem
      PROFILE_SERVICE_GRPC_URL: profile-service:50051
      MEDIA_SERVICE_GRPC_URL: media-service:50052
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      LOG_FILE: /logs/post-service.log
      LOG_LEVEL: info
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:4040/health/ready',res=>process.exit(res.statusCode===200?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      mongo-post-service:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      profile-service:
        condition: service_healthy
      media-service:
        condition: service_healthy
    networks:
      - gateway-net
      - services-net
      - db-net

  media-service:
    build:
      context: .
      dockerfile: apps/media-service/Dockerfile
    container_name: breezy-media-service
    restart: unless-stopped
    volumes:
      - shared-logs:/logs
      - /etc/breezy/secrets/public.pem:/secrets/public.pem:ro
    environment:
      NODE_ENV: production
      SERVICE_NAME: media-service
      OTEL_ENABLED: ${OTEL_ENABLED:-false}
      OTEL_SERVICE_NAME: media-service
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://jaeger:4318/v1/traces
      PORT: 4050
      GRPC_PORT: 50052
      DATABASE_URL: mongodb://mongo-media-service:27017/media_service
      JWT_PUBLIC_KEY_PATH: /secrets/public.pem
      LOG_FILE: /logs/media-service.log
      LOG_LEVEL: info
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:4050/health/ready',res=>process.exit(res.statusCode===200?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      mongo-media-service:
        condition: service_healthy
    networks:
      - gateway-net
      - services-net
      - db-net

  notifications-service:
    build:
      context: .
      dockerfile: apps/notifications-service/Dockerfile
    container_name: breezy-notifications-service
    restart: unless-stopped
    volumes:
      - shared-logs:/logs
      - /etc/breezy/secrets/public.pem:/secrets/public.pem:ro
    environment:
      NODE_ENV: production
      SERVICE_NAME: notifications-service
      OTEL_ENABLED: ${OTEL_ENABLED:-false}
      OTEL_SERVICE_NAME: notifications-service
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://jaeger:4318/v1/traces
      PORT: 4060
      DATABASE_URL: mongodb://mongo-notifications-service:27017/notifications_service
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASS}@rabbitmq:5672
      JWT_PUBLIC_KEY_PATH: /secrets/public.pem
      PROFILE_SERVICE_GRPC_URL: profile-service:50051
      FRONTEND_URL: https://${DOMAIN}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_FROM: ${SMTP_FROM}
      LOG_FILE: /logs/notifications-service.log
      LOG_LEVEL: info
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:4060/health/ready',res=>process.exit(res.statusCode===200?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      mongo-notifications-service:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      profile-service:
        condition: service_healthy
    networks:
      - gateway-net
      - services-net
      - db-net

  message-service:
    build:
      context: .
      dockerfile: apps/message-service/Dockerfile
    container_name: breezy-message-service
    restart: unless-stopped
    volumes:
      - shared-logs:/logs
      - /etc/breezy/secrets/public.pem:/secrets/public.pem:ro
    environment:
      NODE_ENV: production
      SERVICE_NAME: message-service
      OTEL_ENABLED: ${OTEL_ENABLED:-false}
      OTEL_SERVICE_NAME: message-service
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://jaeger:4318/v1/traces
      PORT: 4030
      DATABASE_URL: mongodb://mongo-message-service:27017/message_service
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASS}@rabbitmq:5672
      JWT_PUBLIC_KEY_PATH: /secrets/public.pem
      PROFILE_SERVICE_GRPC_URL: profile-service:50051
      FRONTEND_URL: https://${DOMAIN}
      LOG_FILE: /logs/message-service.log
      LOG_LEVEL: info
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:4030/health/ready',res=>process.exit(res.statusCode===200?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      mongo-message-service:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      profile-service:
        condition: service_healthy
    networks:
      - gateway-net
      - services-net
      - db-net

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: https://${DOMAIN}
        NEXT_PUBLIC_GIPHY_API_KEY: ${NEXT_PUBLIC_GIPHY_API_KEY}
    container_name: breezy-web
    restart: unless-stopped
    environment:
      API_URL: http://gateway
      HOSTNAME: "0.0.0.0"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('net').connect(3000,'127.0.0.1').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    depends_on:
      - auth-service
      - profile-service
      - post-service
      - media-service
      - notifications-service
      - message-service
    networks:
      - gateway-net

  swagger-ui:
    image: swaggerapi/swagger-ui
    container_name: breezy-swagger-ui
    restart: unless-stopped
    environment:
      URL: /openapi.json
      BASE_URL: /api-docs
    networks:
      - gateway-net

  gateway:
    build:
      context: .
      dockerfile: apps/gateway/Dockerfile
    container_name: breezy-gateway
    restart: unless-stopped
    environment:
      AUTH_UPSTREAM: auth-service:4020
      PROFILE_UPSTREAM: profile-service:4010
      POST_UPSTREAM: post-service:4040
      MEDIA_UPSTREAM: media-service:4050
      NOTIFICATIONS_UPSTREAM: notifications-service:4060
      MESSAGE_UPSTREAM: message-service:4030
      WEB_UPSTREAM: web:3000
      SWAGGER_UPSTREAM: swagger-ui:8080
      KIBANA_UPSTREAM: kibana:5601
      RABBITMQ_UPSTREAM: rabbitmq:15672
      JAEGER_UPSTREAM: jaeger:16686
      TRACING_DOMAIN: traces.breezy.clementomnes.dev
      GRAFANA_UPSTREAM: grafana:3000
      GRAFANA_DOMAIN: grafana.breezy.clementomnes.dev
      CORS_ORIGIN_1: https://breezy.clementomnes.dev
      CORS_ORIGIN_2: http://localhost:3000
      LOGS_DOMAIN: logs.breezy.clementomnes.dev
      MQ_DOMAIN: mq.breezy.clementomnes.dev
    volumes:
      - /etc/breezy/secrets/.htpasswd-kibana:/etc/nginx/.htpasswd-kibana:ro
    depends_on:
      auth-service:
        condition: service_healthy
      profile-service:
        condition: service_healthy
      post-service:
        condition: service_healthy
      media-service:
        condition: service_healthy
      notifications-service:
        condition: service_healthy
      message-service:
        condition: service_healthy
      web:
        condition: service_healthy
      swagger-ui:
        condition: service_started
      kibana:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      jaeger:
        condition: service_started
      grafana:
        condition: service_started
    networks:
      - gateway-net
      - dokploy-network

  filebeat:
    build:
      context: ./apps/filebeat
      dockerfile: Dockerfile
    container_name: breezy-filebeat
    restart: unless-stopped
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    volumes:
      - shared-logs:/logs:ro
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - services-net

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: breezy-prometheus
    restart: unless-stopped
    mem_limit: 512m
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    volumes:
      - ./apps/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./apps/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    networks:
      - services-net

  grafana:
    image: grafana/grafana:11.3.0
    container_name: breezy-grafana
    restart: unless-stopped
    mem_limit: 256m
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - services-net
      - gateway-net

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    container_name: breezy-jaeger
    restart: unless-stopped
    mem_limit: 512m
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    networks:
      - services-net
      - gateway-net

networks:
  gateway-net:
    driver: bridge
  services-net:
    driver: bridge
  db-net:
    driver: bridge
  dokploy-network:
    external: true

volumes:
  mongo-post-service-data:
  mongo-media-service-data:
  mongo-notifications-service-data:
  mongo-message-service-data:
  postgres-user-service-data:
  postgres-profile-service-data:
  elasticsearch-data:
  shared-logs:
  prometheus-data:
  grafana-data:
