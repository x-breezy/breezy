services:
  gateway:
    build:
      context: .
      dockerfile: apps/gateway/Dockerfile
    container_name: breezy-gateway
    restart: unless-stopped
    ports:
      - "80:80"
    networks:
      - breezy

  mongo-post-service:
    image: mongo:8
    container_name: breezy-mongo-post-service
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: post_service
    volumes:
      - mongo-post-service-data:/data/db
    networks:
      - breezy
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongo-media-service:
    image: mongo:8
    container_name: breezy-mongo-media-service
    restart: unless-stopped
    ports:
      - "27018:27017"
    environment:
      MONGO_INITDB_DATABASE: media_service
    volumes:
      - mongo-media-service-data:/data/db
    networks:
      - breezy
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-user-service:
    image: postgres:16
    container_name: breezy-postgres-user-service
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: user_service
      POSTGRES_HOST_AUTH_METHOD: md5
      POSTGRES_INITDB_ARGS: "--auth-host=md5 --auth-local=md5"
    volumes:
      - postgres-user-service-data:/var/lib/postgresql/data
    networks:
      - breezy
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-profile-service:
    image: postgres:16
    container_name: breezy-postgres-profile-service
    restart: unless-stopped
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: profile_service
      POSTGRES_HOST_AUTH_METHOD: md5
      POSTGRES_INITDB_ARGS: "--auth-host=md5 --auth-local=md5"
    volumes:
      - postgres-profile-service-data:/var/lib/postgresql/data
    networks:
      - breezy
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: breezy-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - breezy
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management
    container_name: breezy-rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: breezy
      RABBITMQ_DEFAULT_PASS: breezy
    networks:
      - breezy
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongo-notifications-service:
    image: mongo:8
    container_name: breezy-mongo-notifications-service
    restart: unless-stopped
    ports:
      - "27019:27017"
    environment:
      MONGO_INITDB_DATABASE: notifications_service
    volumes:
      - mongo-notifications-service-data:/data/db
    networks:
      - breezy
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  swagger-ui:
    image: swaggerapi/swagger-ui:latest
    container_name: breezy-swagger-ui
    restart: unless-stopped
    environment:
      URL: /openapi.json
      BASE_URL: /api-docs
    networks:
      - breezy

