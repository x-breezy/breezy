# Validate the Bearer token via auth-service, then forward the resolved
# identity to the upstream. Included by every protected location.
auth_request /authenticate;
auth_request_set $user_id    $upstream_http_x_user_id;
auth_request_set $user_role $upstream_http_x_role;
# Repeat base headers — nginx drops parent-level proxy_set_header when a
# child block defines any of its own.
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-User-Id         $user_id;
proxy_set_header X-Role            $user_role;
