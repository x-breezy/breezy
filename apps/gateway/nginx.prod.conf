events {
  worker_connections 1024;
}

http {
  resolver 127.0.0.11 valid=10s ipv6=off;

  gzip on;
  gzip_types text/plain application/json application/javascript text/css text/xml;
  gzip_min_length 1000;
  gzip_proxied any;

  upstream auth_service          { server auth-service:4020; }
  upstream profile_service       { server profile-service:4010; }
  upstream post_service          { server post-service:4040; }
  upstream media_service         { server media-service:4050; }
  upstream notifications_service { server notifications-service:4060; }
  upstream web                   { server web:3000; }
  upstream swagger_ui            { server swagger-ui:8080; }
  upstream kibana                { server kibana:5601; }
  upstream rabbitmq_mgmt         { server rabbitmq:15672; }

  # Rate limiting zones
  # auth zone : 10 req/min, keyed by IP , brute-force guard on sign-in/sign-up.
  # api zone  : 600 req/min, keyed by Bearer token, per-user limiting.
  #   Keying by IP is broken in this topology: every service + browser hit the
  #   gateway from the same docker host IP. Keying on $http_authorization (the
  #   per-user access token) gives real per-user isolation. An empty key (no
  #   Authorization header) is not counted by nginx; those requests receive a
  #   401 from auth_request before any rate limit matters.
  limit_req_zone $binary_remote_addr zone=auth:10m rate=1000r/m;
  limit_req_zone $http_authorization zone=api:10m  rate=60000r/m;
  limit_req_status 429;

  map $http_origin $cors_origin {
    "https://breezy.clementomnes.dev" "https://breezy.clementomnes.dev";
    "http://localhost:3000"           "http://localhost:3000";
    default                           "";
  }

  server {
    listen 80;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Custom 401 error - returns JSON for API routes instead of HTML
    error_page 401 @error401;
    location @error401 {
      include /etc/nginx/cors.conf;
      add_header Content-Type application/json;
      return 401 '{"success":false,"error":"Unauthorized"}';
    }

    # Internal - nginx calls this to validate the Bearer token.
    # auth-service returns 200 (valid) or 401 (invalid/missing).
    location /authenticate {
      internal;
      client_max_body_size 300m;
      proxy_pass_request_body  off;
      proxy_set_header Content-Length "";
      proxy_set_header X-Original-URI $request_uri;
      proxy_pass http://auth_service/auth/validate;
    }

    # public, JWKS endpoint for downstream services
    location /.well-known/jwks.json {
      include /etc/nginx/cors.conf;
      if ($request_method = OPTIONS) { return 204; }
      proxy_pass http://auth_service/.well-known/jwks.json;
    }

    # NO JWT --------------------------------------------------
    location /api/auth/sign-in {
      include /etc/nginx/cors.conf;
      if ($request_method = OPTIONS) { return 204; }
      limit_req zone=auth burst=5 nodelay;
      proxy_pass http://auth_service/auth/sign-in;
    }

    location /api/auth/sign-up {
      include /etc/nginx/cors.conf;
      if ($request_method = OPTIONS) { return 204; }
      limit_req zone=auth burst=5 nodelay;
      proxy_pass http://auth_service/auth/sign-up;
    }

    location /api/auth/refresh {
      include /etc/nginx/cors.conf;
      if ($request_method = OPTIONS) { return 204; }
      proxy_pass http://auth_service/auth/refresh;
    }

    location /api/auth/logout {
      include /etc/nginx/cors.conf;
      if ($request_method = OPTIONS) { return 204; }
      proxy_pass http://auth_service/auth/logout;
    }

    location /api/auth/profile-created {
      include /etc/nginx/cors.conf;
      if ($request_method = OPTIONS) { return 204; }
      proxy_pass http://auth_service/auth/profile-created;
    }

    location /api/auth/verify-email {
      include /etc/nginx/cors.conf;
      if ($request_method = OPTIONS) { return 204; }
      proxy_pass http://auth_service/auth/verify-email;
    }

    location /api/auth/resend-verification {
      include /etc/nginx/cors.conf;
      if ($request_method = OPTIONS) { return 204; }
      proxy_pass http://auth_service/auth/resend-verification;
    }

    location /api/auth/forgot-password {
      include /etc/nginx/cors.conf;
      if ($request_method = OPTIONS) { return 204; }
      proxy_pass http://auth_service/auth/forgot-password;
    }

    location /api/auth/reset-password {
      include /etc/nginx/cors.conf;
      if ($request_method = OPTIONS) { return 204; }
      proxy_pass http://auth_service/auth/reset-password;
    }

    location /api/auth/2fa/verify-login {
      include /etc/nginx/cors.conf;
      if ($request_method = OPTIONS) { return 204; }
      proxy_pass http://auth_service/auth/2fa/verify-login;
    }

    location = /api/auth/google/callback {
      include /etc/nginx/cors.conf;
      proxy_pass http://auth_service/auth/google/callback;
    }

    location = /api/auth/google/complete {
      include /etc/nginx/cors.conf;
      if ($request_method = OPTIONS) { return 204; }
      proxy_pass http://auth_service/auth/google/complete;
    }

    location = /api/auth/google {
      include /etc/nginx/cors.conf;
      proxy_pass http://auth_service/auth/google;
    }

    # JWT required ----------------------------------------------
    location /api/auth/ {
      include /etc/nginx/cors.conf;
      if ($request_method = OPTIONS) { return 204; }
      limit_req zone=api burst=20 nodelay;
      auth_request /authenticate;
      proxy_pass http://auth_service/auth/;
    }

    location /api/users/ {
      include /etc/nginx/cors.conf;
      if ($request_method = OPTIONS) { return 204; }
      include /etc/nginx/auth.conf;
      proxy_pass http://auth_service/users/;
    }

    location /api/reports/ {
      include /etc/nginx/cors.conf;
      if ($request_method = OPTIONS) { return 204; }
      include /etc/nginx/auth.conf;
      proxy_pass http://auth_service/reports/;
    }

    location = /api/profiles/search {
      include /etc/nginx/cors.conf;
      if ($request_method = OPTIONS) { return 204; }
      limit_req zone=api burst=20 nodelay;
      proxy_pass http://profile_service/profiles/search;
    }

    location = /api/profiles/batch {
      include /etc/nginx/cors.conf;
      if ($request_method = OPTIONS) { return 204; }
      limit_req zone=api burst=20 nodelay;
      proxy_pass http://profile_service/profiles/batch;
    }

    location /api/profiles/ {
      include /etc/nginx/cors.conf;
      if ($request_method = OPTIONS) { return 204; }
      limit_req zone=api burst=20 nodelay;
      auth_request /authenticate;
      proxy_pass http://profile_service/profiles/;
    }

    location = /api/posts/trending-tags {
      include /etc/nginx/cors.conf;
      if ($request_method = OPTIONS) { return 204; }
      limit_req zone=api burst=20 nodelay;
      proxy_pass http://post_service/posts/trending-tags;
    }

    location = /api/posts/search {
      include /etc/nginx/cors.conf;
      if ($request_method = OPTIONS) { return 204; }
      limit_req zone=api burst=20 nodelay;
      proxy_pass http://post_service/posts/search;
    }

    location /api/posts/ {
      include /etc/nginx/cors.conf;
      if ($request_method = OPTIONS) { return 204; }
      limit_req zone=api burst=20 nodelay;
      auth_request /authenticate;
      proxy_pass http://post_service/posts/;
    }

    # Image and video bytes are public on GET (so <img src> and <video src>
    # work without a token). Only GET is exposed here; upload + meta fall
    # through to the general /api/media/ block below (still authed).
    location ~ ^/api/media/((images|videos)/[^/]+)$ {
      include /etc/nginx/cors.conf;
      if ($request_method = OPTIONS) { return 204; }
      limit_req zone=api burst=20 nodelay;
      limit_except GET { deny all; }
      proxy_pass http://media_service/$1;
    }

    location /api/media/ {
      client_max_body_size 300m;
      include /etc/nginx/cors.conf;
      if ($request_method = OPTIONS) { return 204; }
      limit_req zone=api burst=20 nodelay;
      auth_request /authenticate;
      proxy_pass http://media_service/;
    }

    # SSE stream, exact match wins over the prefix block below.
    # EventSource (browser) cannot send an Authorization header, so we skip
    # auth_request here. The notifications-service identity middleware
    # authenticates via the breezy-token cookie instead (verifyJwt-signed).
    # No rate limit: this is a single long-lived connection per user.
    location = /api/notifications/stream {
      include /etc/nginx/cors.conf;
      if ($request_method = OPTIONS) { return 204; }
      proxy_http_version 1.1;
      proxy_set_header   Connection "";
      proxy_buffering    off;
      proxy_cache        off;
      proxy_read_timeout 3600s;
      proxy_pass http://notifications_service/notifications/stream;
    }

    location /api/notifications/ {
      include /etc/nginx/cors.conf;
      if ($request_method = OPTIONS) { return 204; }
      limit_req zone=api burst=20 nodelay;
      auth_request /authenticate;
      proxy_http_version 1.1;
      proxy_set_header   Connection "";
      proxy_buffering    off;
      proxy_cache        off;
      proxy_read_timeout 3600s;
      proxy_pass http://notifications_service/notifications/;
    }

    location /openapi.json {
      include /etc/nginx/security.conf;
      alias /etc/nginx/openapi.json;
      add_header Content-Type application/json;
    }

    location /api-docs/ {
      include /etc/nginx/security-web.conf;
      proxy_pass http://swagger_ui/api-docs/;
    }

    # front
    location / {
      include /etc/nginx/security-web.conf;
      proxy_http_version 1.1;
      proxy_set_header Upgrade    $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_pass http://web;
    }
  }

  server {
    listen 80;
    server_name logs.breezy.clementomnes.dev;

    auth_basic "Breezy Logs";
    auth_basic_user_file /etc/nginx/.htpasswd-kibana;

    location / {
      proxy_pass http://kibana;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }

  server {
    listen 80;
    server_name mq.breezy.clementomnes.dev;

    location / {
      proxy_pass http://rabbitmq_mgmt;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
