events {
  worker_connections 1024;
}

http {
  upstream auth_service          { server host.docker.internal:4020; }
  upstream profile_service       { server host.docker.internal:4010; }
  upstream post_service          { server host.docker.internal:4040; }
  upstream media_service         { server host.docker.internal:4050; }
  upstream notifications_service { server host.docker.internal:4060; }
  upstream web                   { server host.docker.internal:3000; }

  map $http_origin $cors_origin {
    "http://localhost:3000" "http://localhost:3000";
    default                 "";
  }

  server {
    listen 80;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Internal - nginx calls this to validate the Bearer token.
    # auth-service returns 200 (valid) or 401 (invalid/missing).
    location /authenticate {
      internal;
      proxy_pass_request_body  off;
      proxy_set_header Content-Length "";
      proxy_set_header X-Original-URI $request_uri;
      proxy_pass http://auth_service/auth/validate;
    }

    # NO JWT --------------------------------------------------
    location /api/auth/sign-in {
      include /etc/nginx/cors.conf;
      if ($request_method = OPTIONS) { return 204; }
      proxy_pass http://auth_service/auth/sign-in;
    }

    location /api/auth/sign-up {
      include /etc/nginx/cors.conf;
      if ($request_method = OPTIONS) { return 204; }
      proxy_pass http://auth_service/auth/sign-up;
    }

    location /api/auth/refresh {
      include /etc/nginx/cors.conf;
      if ($request_method = OPTIONS) { return 204; }
      proxy_pass http://auth_service/auth/refresh;
    }

    location /api/auth/logout {
      include /etc/nginx/cors.conf;
      if ($request_method = OPTIONS) { return 204; }
      proxy_pass http://auth_service/auth/logout;
    }

    location /api/auth/verify-email {
      include /etc/nginx/cors.conf;
      if ($request_method = OPTIONS) { return 204; }
      proxy_pass http://auth_service/auth/verify-email;
    }

    location /api/auth/resend-verification {
      include /etc/nginx/cors.conf;
      if ($request_method = OPTIONS) { return 204; }
      proxy_pass http://auth_service/auth/resend-verification;
    }

    location /api/auth/forgot-password {
      include /etc/nginx/cors.conf;
      if ($request_method = OPTIONS) { return 204; }
      proxy_pass http://auth_service/auth/forgot-password;
    }

    location /api/auth/reset-password {
      include /etc/nginx/cors.conf;
      if ($request_method = OPTIONS) { return 204; }
      proxy_pass http://auth_service/auth/reset-password;
    }

    location /api/auth/2fa/verify-login {
      include /etc/nginx/cors.conf;
      if ($request_method = OPTIONS) { return 204; }
      proxy_pass http://auth_service/auth/2fa/verify-login;
    }

    # JWT required ----------------------------------------------
    location /api/auth/ {
      include /etc/nginx/cors.conf;
      if ($request_method = OPTIONS) { return 204; }
      include /etc/nginx/auth.conf;
      proxy_pass http://auth_service/auth/;
    }

    location /api/users/ {
      include /etc/nginx/cors.conf;
      if ($request_method = OPTIONS) { return 204; }
      include /etc/nginx/auth.conf;
      proxy_pass http://auth_service/users/;
    }

    location /api/reports/ {
      include /etc/nginx/cors.conf;
      if ($request_method = OPTIONS) { return 204; }
      include /etc/nginx/auth.conf;
      proxy_pass http://auth_service/reports/;
    }

    location /api/profiles/ {
      include /etc/nginx/cors.conf;
      if ($request_method = OPTIONS) { return 204; }
      include /etc/nginx/auth.conf;
      proxy_pass http://profile_service/profiles/;
    }

    location /api/posts/ {
      include /etc/nginx/cors.conf;
      if ($request_method = OPTIONS) { return 204; }
      include /etc/nginx/auth.conf;
      proxy_pass http://post_service/posts/;
    }

    location /api/media/ {
      client_max_body_size 300m;
      include /etc/nginx/cors.conf;
      if ($request_method = OPTIONS) { return 204; }
      include /etc/nginx/auth.conf;
      proxy_pass http://media_service/media/;
    }

    location /api/notifications/ {
      include /etc/nginx/cors.conf;
      if ($request_method = OPTIONS) { return 204; }
      include /etc/nginx/auth.conf;
      proxy_http_version 1.1;
      proxy_set_header   Connection "";
      proxy_buffering    off;
      proxy_cache        off;
      proxy_read_timeout 3600s;
      proxy_pass http://notifications_service/notifications/;
    }

    # front
    location / {
      proxy_http_version 1.1;
      proxy_set_header Upgrade    $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_pass http://web;
    }
  }
}
