global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: auth-service
    metrics_path: /metrics
    static_configs:
      - targets: ["auth-service:4020"]

  - job_name: profile-service
    metrics_path: /metrics
    static_configs:
      - targets: ["profile-service:4010"]

  - job_name: message-service
    metrics_path: /metrics
    static_configs:
      - targets: ["message-service:4030"]

  - job_name: post-service
    metrics_path: /metrics
    static_configs:
      - targets: ["post-service:4040"]

  - job_name: media-service
    metrics_path: /metrics
    static_configs:
      - targets: ["media-service:4050"]

  - job_name: notifications-service
    metrics_path: /metrics
    static_configs:
      - targets: ["notifications-service:4060"]

  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]
